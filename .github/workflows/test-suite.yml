name: Test Suite

on: push

jobs:
  tests:
    name: Python ${{ matrix.python-version }} ubuntu-24.04
    runs-on: ubuntu-24.04
    services:
      pypi_wayback:
        image: ghcr.io/waleko/pypi-wayback
        ports:
        - 8629:8080
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Pin h11 to compatible version
      run: sed -i 's|h11 @ 
        git+https://github.com/python-hyper/h11.git@master|h11==0.14.0|' 
        requirements.txt
      shell: bash
    - name: Install dependencies
      run: scripts/install
      shell: bash
    - name: Run linting checks
      run: scripts/check
      shell: bash
    - name: Build package & docs
      run: scripts/build
      shell: bash
    - name: Run tests
      run: scripts/test
      shell: bash
    - name: Enforce coverage
      run: scripts/coverage
      shell: bash

env:
  PIP_INDEX_URL: http://localhost:8629/2024-01-17
  UV_INDEX_URL: http://localhost:8629/2024-01-17
